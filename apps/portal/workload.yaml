# OpenChoreo workload descriptor, read from the component directory (appPath)
# when the WSO2 Developer Platform builds this service. The app is served under
# /<component>-<endpoint> on a shared host, the BASE_PATH it is built for.
#
# Settings are not here: they are set per environment as VITE_* environment
# variables (the keys of config.js.example), which server.mjs serves to the
# browser as <base>/config.js.
apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: apex-bank-portal
endpoints:
  - name: web
    port: 18000
    type: HTTP
    # The gateway rewrites the public prefix to basePath; keeping the two equal
    # passes it through unchanged, as server.mjs expects.
    basePath: /apex-bank-portal-web
    visibility:
      - external
