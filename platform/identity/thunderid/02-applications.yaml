# Apex Bank -- hosted ThunderID bundle. Step 2: applications and the agent.
# Import with apex-thunderid.env. Order: README.md.
---
resource_type: application
id: apex-security-client
type: fullstack
# The console's Type column shows `template`, not `type`. `-embedded`: an app
# with no OAuth profile, started server-side with its flow secret.
template: server-embedded
name: Apex Bank Passkey Enrolment
description: Registers a customer's passkey; started by the assistant on the customer's behalf
ouId: "fe34718f-3844-5d09-9abb-fde9cfee972a"
authFlowHandle: apex-passkey-enrol
flowSecret: "{{.APEX_SECURITY_FLOW_SECRET}}"
---
resource_type: application
id: apex-portal-client
type: browser
template: browser
name: Apex Bank Customer Portal
description: Sign-in for customers of the web banking portal and its AI assistant
logoUrl: "data:image/png;base64,"
themeId: apex-theme
layoutId: "ba37e552-00e8-5c59-8b67-5c00a29d191c"
ouId: "fe34718f-3844-5d09-9abb-fde9cfee972a"
authFlowHandle: apex-login
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: apex-portal-client
      redirectUris:
        - "{{.APEX_PORTAL_ORIGIN}}/oauth/callback"
      postLogoutRedirectUris:
        - "{{.APEX_PORTAL_ORIGIN}}"
      grantTypes: ["authorization_code", "refresh_token"]
      responseTypes: ["code"]
      tokenEndpointAuthMethod: "none"
      pkceRequired: true
      publicClient: true
      scopes:
        - openid
        - profile
        - email
        - "apex:agent:chat:read"
        - "apex:agent:chat:write"
        - "apex:bank:accounts:read"
        - "apex:bank:accounts:balances:read"
        - "apex:bank:accounts:transactions:read"
        - "apex:bank:payees:read"
        - "apex:bank:payments:write"
        - "apex:mcp:accounts:read"
        - "apex:mcp:transactions:read"
        - "apex:mcp:payees:read"
        - "apex:mcp:payments:write"
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes: ["username", "email", "given_name", "family_name", "ouId", "ouHandle"]
        idToken:
          validityPeriod: 3600
          userAttributes: ["username", "email", "given_name", "family_name"]
---
resource_type: application
id: apex-mcp-client
type: custom
template: custom
name: Apex Bank MCP Server
description: Banking tools for the AI assistant; runs the passkey check before a payment
ouId: "fe34718f-3844-5d09-9abb-fde9cfee972a"
authFlowHandle: apex-payment-stepup
flowSecret: "{{.APEX_MCP_FLOW_SECRET}}"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: apex-mcp-client
      clientSecret: "{{.APEX_MCP_CLIENT_SECRET}}"
      grantTypes: ["client_credentials", "urn:ietf:params:oauth:grant-type:token-exchange"]
      tokenEndpointAuthMethod: "client_secret_basic"
      publicClient: false
      scopes:
        - openid
        - "apex:bank:accounts:read"
        - "apex:bank:accounts:balances:read"
        - "apex:bank:accounts:transactions:read"
        - "apex:bank:payees:read"
        - "apex:bank:payments:write"
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
---
resource_type: application
id: apex-consent-portal-client
type: custom
template: custom
name: Apex Bank Consent Portal
description: Where customers review and revoke the access they have granted
logoUrl: "data:image/png;base64,"
themeId: apex-theme
layoutId: "ba37e552-00e8-5c59-8b67-5c00a29d191c"
ouId: "fe34718f-3844-5d09-9abb-fde9cfee972a"
authFlowHandle: apex-login
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: apex-consent-portal-client
      clientSecret: "{{.APEX_CONSENT_PORTAL_CLIENT_SECRET}}"
      redirectUris:
        - "{{.APEX_CONSENT_PORTAL_ORIGIN}}/auth/callback"
      postLogoutRedirectUris:
        - "{{.APEX_CONSENT_PORTAL_ORIGIN}}/"
      grantTypes: ["authorization_code", "refresh_token"]
      responseTypes: ["code"]
      tokenEndpointAuthMethod: "client_secret_basic"
      publicClient: false
      scopes:
        - openid
        - profile
        - email
        - "portal:consents:read:self"
        - "portal:consents:write:self"
        - "portal:elements:read"
        - "portal:purposes:read"
      scopeClaims:
        "portal:consents:read:self": []
        "portal:consents:write:self": []
        "portal:elements:read": []
        "portal:purposes:read": []
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
          defaultAudience: "urn:apex:consent-portal"
        idToken:
          validityPeriod: 3600
          userAttributes: ["username", "email", "given_name", "family_name"]
---
# The assistant -- one client. It authenticates as itself (client_credentials,
# for its actor token) AND performs the delegated exchange, so its id is both
# the exchange's client and `act.sub` on the result. Replaces the local stack's
# separate `apex-agent-client` application.
#
# includeActClaim is the whole point: without it the exchanged token carries no
# `act` claim and the agent vanishes from the provenance chain.
resource_type: agent
id: apex-banking-agent
ouId: "fe34718f-3844-5d09-9abb-fde9cfee972a"
type: default
name: Apex Bank AI Assistant
description: The AI assistant; acts for a signed-in customer within what they consented to
# The built-in agent schema's three optional attributes. `model` is the agent's
# configured default (AGENT_LLM__MODEL); keep the two in step.
attributes:
  modelProvider: anthropic
  model: claude-haiku-4-5-20251001
  function: assistant
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: apex-banking-agent
      clientSecret: "{{.APEX_AGENT_IDENTITY_SECRET}}"
      grantTypes: ["client_credentials", "urn:ietf:params:oauth:grant-type:token-exchange"]
      tokenEndpointAuthMethod: "client_secret_basic"
      includeActClaim: true
      scopes:
        - openid
        - "apex:mcp:accounts:read"
        - "apex:mcp:transactions:read"
        - "apex:mcp:payees:read"
        - "apex:mcp:payments:write"
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes: ["username", "email", "given_name", "family_name", "ouId", "ouHandle"]
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
