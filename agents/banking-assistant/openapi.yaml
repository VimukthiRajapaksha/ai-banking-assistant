# OpenAPI document for the agent's HTTP API, generated from the FastAPI app
# (src/ai_banking_agent/server.py, security.py). Regenerate when routes change.
# Required by AMP for a Custom API agent (inputInterface.schema.path). AMP stores
# it for display only: the gateway does not enforce `security` from it.
openapi: 3.1.0
info:
  title: Apex Bank AI Assistant
  version: 1.0.0
  description: 'Conversational banking assistant. Acts for a signed-in customer: exchanges
    the customer''s token for a delegated one and calls the bank''s MCP tools within
    what the customer has consented to. Also relays passkey enrolment, which needs
    a server-held ThunderID flow secret.'
paths:
  /security/passkey/start:
    post:
      summary: Start registering a passkey for the signed-in customer
      operationId: start_security_passkey_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - customerToken: []
  /security/passkey/finish:
    post:
      summary: Finish registering a passkey
      operationId: finish_security_passkey_finish_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Finish Security Passkey Finish Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - customerToken: []
  /chat:
    post:
      summary: Send a message, or answer a consent or step-up form, in a conversation
      operationId: chat_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - customerToken:
        - apex:agent:chat:write
      description: 'Requires scope: apex:agent:chat:write.'
components:
  schemas:
    ChatRequest:
      properties:
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        elicitation_response:
          anyOf:
          - $ref: '#/components/schemas/ElicitationAnswer'
          - type: 'null'
      type: object
      title: ChatRequest
    ChatResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        reply:
          type: string
          title: Reply
        status:
          type: string
          title: Status
        elicitation:
          anyOf:
          - $ref: '#/components/schemas/ConsentForm'
          - type: 'null'
      type: object
      required:
      - session_id
      - reply
      - status
      title: ChatResponse
    ConsentForm:
      properties:
        key:
          type: string
          title: Key
        message:
          type: string
          title: Message
        consent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Id
        schema:
          additionalProperties: true
          type: object
          title: Schema
      type: object
      required:
      - key
      - message
      title: ConsentForm
    ElicitationAnswer:
      properties:
        key:
          type: string
          title: Key
        action:
          type: string
          title: Action
          default: accept
        content:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Content
      type: object
      required:
      - key
      title: ElicitationAnswer
      description: The user's answer to a consent form, relayed verbatim to the MCP
        server.
    FinishRequest:
      properties:
        execution_id:
          type: string
          title: Execution Id
        challenge_token:
          type: string
          title: Challenge Token
        credential_id:
          type: string
          title: Credential Id
        client_data_json:
          type: string
          title: Client Data Json
        attestation_object:
          type: string
          title: Attestation Object
      type: object
      required:
      - execution_id
      - challenge_token
      - credential_id
      - client_data_json
      - attestation_object
      title: FinishRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    StartRequest:
      properties:
        id_token:
          type: string
          title: Id Token
      type: object
      required:
      - id_token
      title: StartRequest
      description: 'Proof of a fresh sign-in, in place of a password.


        The ID token from the sign-in that just happened. Its `auth_time` is the

        claim that matters -- the access token does not carry one -- and it is

        checked for freshness and against the access token''s subject.'
    StartResponse:
      properties:
        creation_options:
          type: string
          title: Creation Options
        execution_id:
          type: string
          title: Execution Id
        challenge_token:
          type: string
          title: Challenge Token
      type: object
      required:
      - creation_options
      - execution_id
      - challenge_token
      title: StartResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The customer's ThunderID access token (audience urn:apex).
