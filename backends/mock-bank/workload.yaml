# OpenChoreo workload descriptor, read from the component directory (appPath)
# when the WSO2 Developer Platform builds this service. Without it the
# generated workload has no endpoint and a Service component fails to deploy
# ("Service components must have at least one endpoint").
apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: apex-bank-mock-backend
endpoints:
  - name: bank-api
    # The port the server listens on (PORT, default 18030 in src/server.js).
    port: 18030
    type: HTTP
    # external: the portal calls the bank from the browser. The service has no
    # authorization of its own -- see README.md.
    visibility:
      - external
