# Passkey enrolment for an EXISTING customer, driven by the portal.
#
# It does NOT authenticate. It identifies, and then registers.
#
# The obvious shape was to prompt for a password here, the way the payment
# step-up falls back to one -- and that is what this flow used to do. But the
# ceremony has to run at the PORTAL's origin (the credential must bind to
# `portal.apex.localhost`, or the in-chat payment step-up cannot use it), and
# ThunderID only collects passwords on its own hosted Gate at a different
# origin. So a password step here means the customer typing their banking
# password into a box OUR code renders, and our services forwarding it. That is
# exactly what federated identity exists to avoid, and it teaches customers the
# habit that makes phishing work.
#
# Instead the portal signs the customer out and back in through ThunderID
# first, so the password is typed on ThunderID's page, and the relay proves it
# happened from the `auth_time` claim on the resulting ID token before starting
# this flow. IdentifyingExecutor then just names the user.
#
# Nothing is weakened by dropping the password: the flow can only be started by
# something holding the Flow Secret, and the relay that holds it takes the
# username from a verified token and refuses to start unless the customer
# authenticated moments ago.
#
# relyingPartyId is the portal host EXACTLY. A parent like apex.localhost would
# let a later second host reuse the same credential, but Chrome refuses it:
# `.localhost` is not a registrable domain there, so the parent is neither equal
# to nor a registrable suffix of the origin, and the ceremony dies with
# SecurityError before the authenticator is ever consulted. Every credential
# binds to this value permanently, so changing it later means re-enrolling
# everyone.
resource_type: flow
id: "ddda5996-7a78-5885-8d0a-f5d9fd363cae"
name: Apex Passkey Enrolment
handle: apex-passkey-enrol
flowType: AUTHENTICATION
nodes:
- id: start
  type: START
  onSuccess: prompt_identity
- id: prompt_identity
  type: PROMPT
  prompts:
  - inputs:
    - ref: enrol_username
      type: TEXT_INPUT
      identifier: username
      required: true
    action:
      ref: action_identify
      nextNode: identity_resolver
- id: identity_resolver
  type: TASK_EXECUTION
  executor:
    name: IdentifyingExecutor
    inputs:
    - ref: enrol_username
      type: TEXT_INPUT
      identifier: username
      required: true
  onSuccess: passkey_reg_start
- id: passkey_reg_start
  type: TASK_EXECUTION
  properties:
    relyingPartyId: portal.apex.localhost
    relyingPartyName: Apex Bank
  executor:
    name: PasskeyAuthExecutor
    mode: register_start
  onSuccess: passkey_reg_finish
- id: passkey_reg_finish
  type: TASK_EXECUTION
  executor:
    name: PasskeyAuthExecutor
    mode: register_finish
  onSuccess: auth_assert
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
- id: end
  type: END
---
# Payment step-up: prove the customer is present, right now, for this payment.
#
# Driven by the MCP server, not the browser: the challenge travels out through
# the tool's elicitation, the ceremony runs in the chat box, and the signed
# response comes back the same way. No model ever sees it.
#
# Passkey first. If the customer has not enrolled one, the challenge fails and
# the flow falls back to a password prompt -- weaker, but it keeps a payment
# possible on a device with no authenticator rather than dead-ending.
#
# Same relyingPartyId as enrolment, and it has to be: a credential is bound to
# the RP ID rather than to the application that registered it, which is what
# lets a passkey enrolled through the portal's Security page satisfy a step-up
# driven by the MCP server. Any mismatch here reads as "no credentials found".
resource_type: flow
id: "ea2fb42c-d506-587c-9c0f-109b5363355a"
name: Apex Payment Step-Up
handle: apex-payment-stepup
flowType: AUTHENTICATION
nodes:
- id: start
  type: START
  onSuccess: prompt_identity
- id: prompt_identity
  type: PROMPT
  prompts:
  - inputs:
    - ref: stepup_username
      type: TEXT_INPUT
      identifier: username
      required: true
    action:
      ref: action_identify
      nextNode: identity_resolver
- id: identity_resolver
  type: TASK_EXECUTION
  executor:
    name: IdentifyingExecutor
    inputs:
    - ref: stepup_username
      type: TEXT_INPUT
      identifier: username
      required: true
  onSuccess: passkey_challenge
- id: passkey_challenge
  type: TASK_EXECUTION
  properties:
    relyingPartyId: portal.apex.localhost
    relyingPartyName: Apex Bank
  executor:
    name: PasskeyAuthExecutor
    mode: challenge
  onSuccess: passkey_verify
  onFailure: prompt_password_fallback
- id: passkey_verify
  type: TASK_EXECUTION
  executor:
    name: PasskeyAuthExecutor
    mode: verify
  onSuccess: auth_assert
- id: prompt_password_fallback
  type: PROMPT
  prompts:
  - inputs:
    - ref: stepup_password
      type: PASSWORD_INPUT
      identifier: password
      required: true
    action:
      ref: action_password
      nextNode: password_fallback
- id: password_fallback
  type: TASK_EXECUTION
  executor:
    name: CredentialsAuthExecutor
    inputs:
    - ref: stepup_username
      type: TEXT_INPUT
      identifier: username
      required: true
    - ref: stepup_password
      type: PASSWORD_INPUT
      identifier: password
      required: true
  onSuccess: auth_assert
- id: auth_assert
  type: TASK_EXECUTION
  executor:
    name: AuthAssertExecutor
  onSuccess: end
- id: end
  type: END
---
# The customer's login, shared by the bank portal and the consent portal.
#
# It exists for one reason: **SSO in ThunderID is per FLOW, not per server.**
# "A session belongs to exactly one flow. Every application that authenticates
# through the same flow shares that flow's session. Two different flows never
# share a session." Both portals already used the default flow, but that flow
# has no session nodes, so the second portal re-prompted a customer who had
# just signed in to the first.
#
# DERIVED FROM the built-in default flow rather than written from scratch. A
# PROMPT node carries the `meta.components` that ThunderID's hosted sign-in
# page renders from; a hand-written node with only `inputs` is valid, drives an
# app-native flow perfectly well, and renders a COMPLETELY BLANK sign-in page.
# Regenerate with: GET /flows/01900000-0000-7000-8000-000000000061, then insert
# the two SSO nodes below.
#
# It does NOT enrol a passkey, and cannot. Enrolment through the hosted Gate
# works only when relyingPartyId equals the GATE's origin
# (thunder.amp.localhost) -- verified: the ceremony completes and a credential
# appears. But a credential is bound to exactly one RP ID, and the in-chat
# payment step-up runs at portal.apex.localhost, so it needs that RP ID
# instead. The two origins share no registrable parent Chrome will accept
# (`.localhost` is refused), and the Gate's own URL is fixed in the
# AMP-managed deployment rather than configurable here. So Gate-hosted
# enrolment and in-chat step-up cannot share a passkey in this topology.
#
# Two nodes make the difference, and they have to bracket the step being
# skipped:
#   * SSOCheckExecutor -- can the following authentication be skipped?
#     onSuccess jumps past it; onFailure runs it. `checkpointRef` names its
#     paired Session node and is required (FLM-1023 without it).
#   * SessionExecutor -- the checkpoint. On a fresh sign-in it establishes the
#     session and saves what was just completed; on a reused one it loads it.
# Both the skip path and the authenticate path converge on the SessionExecutor,
# or a reused session never loads the user and everything downstream sees
# nobody.
{
  "resource_type": "flow",
  "id": "8cf50a09-7053-53dd-891d-7d60531114d9",
  "name": "Apex Customer Login",
  "handle": "apex-login",
